name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        peewee: ["peewee==3.17.*", "peewee"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "${{ matrix.peewee }}"
      - name: Lint
        run: ruff check frigate_tier tests

      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/frigate-tier --version
          /tmp/clean/bin/frigate-tier plan --help

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t frigate-tier:ci .
      - run: docker run --rm frigate-tier:ci --version

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f tests/e2e/Dockerfile -t frigate-tier:e2e .
      - name: Move 315 real segments and check none were lost
        run: |
          mkdir -p /tmp/ft-e2e
          docker run --rm -v "$PWD:/src" -v /tmp/ft-e2e:/work \
            frigate-tier:e2e sh /src/tests/e2e/run.sh
      - name: SIGKILL a move in flight and check none were lost
        run: |
          docker run --rm -v "$PWD:/src" -v /tmp/ft-e2e:/work \
            frigate-tier:e2e sh /src/tests/e2e/crash.sh
